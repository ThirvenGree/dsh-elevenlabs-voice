<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet 语音</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px 16px;background:#f5f7fa;color:#213244;font:14px/1.65 system-ui}h2{font-size:19px;margin:0}small,#status{color:#60758a}button,input,textarea,select{font:inherit;border:1px solid #ccd7df;border-radius:9px;padding:8px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#315f78;color:white;border:0}button:disabled{opacity:.5}input,textarea,select{width:100%}input[type=checkbox]{width:auto}label{display:block;margin:10px 0}#log{height:190px;overflow:auto;background:white;padding:12px;border-radius:12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{color:#557a8a}.assistant{margin:9px 0}#status{min-height:25px}.row{display:flex;gap:7px;margin:8px 0}.row>*{flex:1}summary{cursor:pointer;font-weight:600}details{background:#e9eff2;border-radius:12px;padding:12px;margin-top:15px}#speaking{color:#1c8068;font-weight:600}p{margin:5px 0}
</style></head><body><h2>Pet 语音 <span id="speaking"></span></h2><small id="model">跟随 DSH 当前模型 · 共用已启用的人设与记忆</small><div id="status" role="status">连接中…</div><div class="row"><button class="primary" id="start">开始实时对话</button><button id="stop">停止 / 打断</button></div><div id="log" aria-live="polite"></div><textarea id="text" rows="2" placeholder="文字对话，或输入需要直接朗读的内容"></textarea><div class="row"><button id="chat">发送并朗读</button><button id="speak">直接朗读</button></div><button id="last">朗读 Pet 当前台词</button><div id="tasks"></div><details><summary>声音与自动说话设置</summary><form id="settings"><label><input type="checkbox" name="enabled"> 启用 Pet 语音</label><p>LLM 留空时实时跟随 DSH；填写后仅此 Pet 使用指定模型。人设继续在 cosplay / 现有 Pet 设置管理。</p><label>LLM 提供商<input name="provider" placeholder="留空跟随 DSH"></label><label>LLM 模型<input name="model" placeholder="留空跟随 DSH"></label><label>声音 ID<input name="voiceId" placeholder="留空沿用统一语音的声音"></label><label>ElevenLabs 模型<input name="ttsModel" placeholder="eleven_v4_turbo"></label><label>音量<input name="volume" type="range" min="0" max="1" step="0.05"></label><label><input type="checkbox" name="autonomous"> 允许已有台词自动出声（默认关闭）</label><p>02:00–06:00 安静；实时对话优先。</p><label>自动说话冷却 / 分钟<input name="cooldownMinutes" type="number" min="1" max="1440"></label><label>每小时自动说话上限<input name="hourlyLimit" type="number" min="1" max="20"></label><button class="primary">保存设置</button></form><p>保存会停止当前 Pet 会话；不会影响 DSH 听写。</p></details><details><summary>Pet 最近记录</summary><p>与 DSH Agent 会话分开。重要事实仍经已有记忆插件审核；清空只删除 Pet 最近记录。</p><button id="clear">清空本 Pet 最近记录</button></details><script src="client.js"></script></body></html>
